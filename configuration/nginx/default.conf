# Websocket upgrade header for proxied Reverb connections (this file is included in `http {}`)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name localhost;

    root /var/www/html/public;
    index index.php index.html;

    # Laravel Reverb (live chat): browsers open ws://<host>:<HTTP_HOST_PORT>/app/<key>.
    # ^~ keeps the PHP regex location below from matching these paths. The upstream is
    # resolved per request through Docker's DNS, so nginx starts (and keeps running)
    # even while the reverb container is down or restarting. Laravel itself publishes
    # straight to reverb:8080 on the internal network, so /apps/* stays unexposed.
    location ^~ /app/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $reverb_upstream http://reverb:8080;

        proxy_pass $reverb_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Longer than Reverb's ping interval (60s), so idle sockets are not cut
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass laravel-app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTP_HOST $http_host;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
